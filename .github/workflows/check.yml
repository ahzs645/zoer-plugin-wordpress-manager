name: Check WordPress plugin
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scanner source is private; package its committed digest-verified runtime.
      - run: git submodule update --init wordpress-plugins/zoer-connect
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun tools/zoer-plugin.mjs validate dist/package
      - run: bun run release
      - uses: actions/upload-artifact@v4
        with:
          name: wordpress-manager
          path: dist/release/*
