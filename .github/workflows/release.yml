# Publishes the WordPress Manager plugin as a GitHub Release. Push a tag
# v<manifest version>. The CLI is vendored: from a Zoer checkout run
#   bun run plugin export-cli <this repo>/tools/zoer-plugin.mjs
# Secrets: ZOER_PLUGIN_SIGNING_KEY (Ed25519 private key, PEM) and ZOER_PLUGIN_KEY_ID.
# Add the matching public key under Extensions → Trusted signing keys in Zoer.
# A release without both secrets fails. To publish an unsigned release on purpose,
# run this workflow manually on the tag with allow_unsigned:
#   gh workflow run release.yml --ref v<version> -f allow_unsigned=true
name: Release WordPress Manager plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: Publish without signing when the signing secrets are missing
        type: boolean
        default: false

permissions:
  contents: write

env:
  BUILD: bun run build
  PACKAGE_DIR: dist/package

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Scanner source is private; package its committed digest-verified runtime.
      - run: git submodule update --init wordpress-plugins/zoer-connect
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Require signing secrets
        env:
          HAS_KEY: ${{ secrets.ZOER_PLUGIN_SIGNING_KEY != '' }}
          HAS_KEY_ID: ${{ secrets.ZOER_PLUGIN_KEY_ID != '' }}
          ALLOW_UNSIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned }}
        run: |
          if [ "$HAS_KEY" = true ] && [ "$HAS_KEY_ID" = true ]; then exit 0; fi
          if [ "$ALLOW_UNSIGNED" = true ]; then
            echo "::warning::Signing secrets are not set; publishing an unsigned release because allow_unsigned is true."
            exit 0
          fi
          echo "::error::ZOER_PLUGIN_SIGNING_KEY and ZOER_PLUGIN_KEY_ID are required. Re-run manually with allow_unsigned=true to publish unsigned."
          exit 1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: $BUILD
      - run: bun tools/zoer-plugin.mjs validate "$PACKAGE_DIR"
      - name: Check the tag matches the manifest version
        run: |
          version=$(jq -r .version "$PACKAGE_DIR/manifest.json")
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1; }
      - name: Package and sign
        env:
          ZOER_PLUGIN_SIGNING_KEY: ${{ secrets.ZOER_PLUGIN_SIGNING_KEY }}
          ZOER_PLUGIN_KEY_ID: ${{ secrets.ZOER_PLUGIN_KEY_ID }}
          ALLOW_UNSIGNED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned }}
        run: |
          set -o pipefail
          # A lone secret is a misconfiguration: the CLI refuses it rather than publishing unsigned.
          bun tools/zoer-plugin.mjs release "$PACKAGE_DIR" --output release | tee "$RUNNER_TEMP/release-result.json"
          if [ "$(tail -n 1 "$RUNNER_TEMP/release-result.json" | jq -r .signed)" != true ] && [ "$ALLOW_UNSIGNED" != true ]; then
            echo "::error::The package was not signed."
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "$GITHUB_REF_NAME"
